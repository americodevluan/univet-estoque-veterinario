# Blueprint do Render — cria PostgreSQL + backend + frontend em um clique.
# Uso: Render Dashboard → New → Blueprint → selecionar este repositório.
# O Render aplica este arquivo automaticamente ao conectar o repositório.

databases:
  - name: univet-db
    plan: free
    databaseName: estoque_veterinario

services:
  # ---------------------------------------------------------------
  # Backend — API REST (Node + Express + Prisma)
  # ---------------------------------------------------------------
  - type: web
    name: univet-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npx prisma migrate deploy && node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: univet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        fromService:
          name: univet-frontend
          type: static
          property: host
      - key: SEED_ON_START
        value: "true"

  # ---------------------------------------------------------------
  # Frontend — site estático (React + Vite)
  # ---------------------------------------------------------------
  - type: web
    name: univet-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && echo "VITE_API_URL=https://$API_URL/api" > .env && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: API_URL
        fromService:
          name: univet-backend
          type: web
          property: host
